services:
  # =============================================================================
  # Redis - Message broker and cache
  # =============================================================================
  redis:
    image: redis:8.2-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - backend

  # =============================================================================
  # Web - FastAPI Backend
  # =============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: linkedin_app
    command: /bin/sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000 --log-level info --access-logfile - --timeout 120"
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # LinkedIn Service - Playwright automation microservice
  # =============================================================================
  linkedin-service:
    build:
      context: ./linkedin-service
      dockerfile: Dockerfile.prod
    container_name: linkedin-service
    restart: always
    env_file:
      - .env
    environment:
      - LINKEDIN_SERVICE_PORT=${LINKEDIN_SERVICE_PORT}
      - MAIN_BACKEND_URL=http://web:8000
      # Redis connection for session storage
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=1
      # 2Captcha API key (ensure this is set in .env)
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # =============================================================================
  # Celery Worker - Background task processing
  # =============================================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: celery_worker
    command: /bin/sh -c "alembic upgrade head && celery -A app.celery_app worker --loglevel=INFO --concurrency=4"
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$(hostname) >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Flower - Celery monitoring UI
  # =============================================================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: flower
    command: /bin/sh -c "alembic upgrade head && celery -A app.celery_app flower --port=5555"
    restart: always
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  # =============================================================================
  # Streamlit - Admin dashboard
  # =============================================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: streamlit
    command: /bin/sh -c "alembic upgrade head && streamlit run streamlit_app/main.py --server.port=8501 --server.address=0.0.0.0"
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - backend

  # =============================================================================
  # Frontend - Next.js application
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Build-time args for Next.js static optimization
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    container_name: frontend
    restart: always
    environment:
      - NODE_ENV=production
      # Runtime env vars (for SSR)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - NEXT_PUBLIC_API_URL_SSR=http://web:8000
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Nginx - Reverse proxy
  # =============================================================================
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - backend

# =============================================================================
# Networks
# =============================================================================
networks:
  backend:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis_data:
    driver: local
